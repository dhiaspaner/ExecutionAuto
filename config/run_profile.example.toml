# Run profile — pre-answers the questions run_reconciliation.py would ask.
#
# Use it when the same workbook runs against the same two servers regularly:
#
#     uv run python run_reconciliation.py --profile config/run_profile.example.toml
#
# Copy this file, change the values, and keep your copy next to the workbook or
# anywhere convenient. Every key is OPTIONAL: whatever is here is used and shown
# on screen, and whatever is missing is asked for one question at a time, exactly
# as it would be without a profile.
#
# ---------------------------------------------------------------------------
# THIS FILE MUST NEVER CONTAIN A PASSWORD.
# ---------------------------------------------------------------------------
# There is no `password` key and none will be added. A file containing one — or
# `pwd`, `secret`, `token` or similar — is REJECTED, not quietly ignored, so a
# mistake is loud rather than silent. This holds for Oracle exactly as it does
# for SQL Server: an Oracle password is typed at runtime behind a hidden prompt,
# kept in memory for the run, and written nowhere.
#
# Two ways to avoid typing a password at all:
#
#   authentication = "windows"   The account already signed in to Windows
#                                connects. Nothing is typed, stored or sent.
#                                SQL Server only — Oracle has no equivalent.
#
#   authentication = "password"  A username lives here; the password is typed
#                                at runtime with a hidden prompt, kept in memory
#                                for the run, and never written anywhere.
#
# ---------------------------------------------------------------------------
# ENGINES: which keys each one uses
# ---------------------------------------------------------------------------
# The key names are the same for both engines; only what they mean changes.
#
#   type = "sqlserver"                  type = "oracle"
#   ------------------------------      ------------------------------
#   server   hostname or IP             server   hostname or IP
#   port     default 1433               port     default 1521
#   database the database name          database the SERVICE NAME
#   authentication "windows" or         authentication "password" only
#                  "password"
#   trust_server_certificate applies    trust_server_certificate is not used
#
# Oracle connects through the `oracledb` driver in its default thin mode, so no
# Oracle Instant Client has to be installed on the machine.
#
# Oracle is a SOURCE engine only. The target is always SQL Server, and a
# [target] saying type = "oracle" is rejected before any question is asked.

version = "1.0"

[workbook]
# Absolute path, or relative to wherever you run the command from.
# On Windows either "C:/data/payments.xlsx" or "C:\\data\\payments.xlsx" works.
path = "/Users/macbook/Downloads/payments_reconciliation_automation_webservice.xlsx"
# The worksheet holding the test cases. Its columns must be ID, Source SQL and
# Target SQL, plus the result columns. The sheet may be named anything.
#
# This workbook keeps a title banner on rows 1-3 and its real headers on row 4,
# so it is read by `reconcile run`, not by run_reconciliation.py, whose inline
# schema expects the headers on row 1.
sheet = "Test Cases"

# ---------------------------------------------------------------------------
# The legacy system being migrated FROM. Oracle or SQL Server.
# ---------------------------------------------------------------------------
# Taken from the tnsnames.ora entry "mohredr":
#
#   (ADDRESS = (PROTOCOL = TCP)(HOST = 10.230.1.196)(PORT = 1521))
#   (CONNECT_DATA = (SERVER = DEDICATED)(SERVICE_NAME = mohredr))
#
# HOST becomes `server`, PORT becomes `port` and SERVICE_NAME becomes
# `database`. SERVER = DEDICATED has no key here: the thin-mode driver builds
# the EasyConnect descriptor 10.230.1.196:1521/mohredr and the listener picks
# the server mode.
[source]
type = "oracle"                      # "oracle" or "sqlserver"
server = "10.230.1.196"              # Oracle host
port = 1521                          # omit to accept 1521 for Oracle, 1433 for SQL Server
database = "mohredr"                 # the SERVICE NAME when type = "oracle"
authentication = "password"          # Oracle supports "password" only
username = "younes_qpro"             # the password is asked for at runtime
# trust_server_certificate = true    # SQL Server sources only; ignored by Oracle

# Thick mode is the default for Oracle, so this key is optional and is spelled
# out here only to make the choice visible.
#
# Thin mode speaks Oracle's wire protocol directly and needs nothing installed,
# but it only reaches Oracle Database 12.1 and later. An older server refuses
# it with:
#
#   DPY-3010: connections to this database server version are not supported
#
# Thick mode loads the Oracle Client library instead and reaches back to Oracle
# Database 9.2. Install Oracle Instant Client, then point oracle_client_dir at
# the directory holding the library (libclntsh on Linux/macOS, oci.dll on
# Windows). Leave the directory out to let the driver find it on PATH,
# LD_LIBRARY_PATH or DYLD_LIBRARY_PATH.
#
# The Instant Client release must itself be old enough for the server: a 19c
# client reaches Oracle 11.2, and only an older client reaches 9.2.
oracle_client_mode = "thick"         # "thick" (default) or "thin"
# oracle_client_dir = "/opt/oracle/instantclient_19_8"

# A SQL Server source instead — delete the [source] block above and uncomment
# this one. Same keys, different meanings, and "windows" becomes available.
#
# [source]
# type = "sqlserver"
# server = "sql-legacy.corp.local"
# port = 1433
# database = "LegacyPayments"
# trust_server_certificate = true
# authentication = "windows"         # or "password", with a username below
# # username = "recon_reader"

# ---------------------------------------------------------------------------
# The migrated system being reconciled TO. Always SQL Server. State the engine
# explicitly: if `type` is missing it is inherited from [source] for backward
# compatibility, and a warning says so — and an inherited "oracle" is an error,
# because this side cannot be Oracle.
# ---------------------------------------------------------------------------
[target]
type = "sqlserver"
server = "sql-mig-01.corp.local"
port = 1433
database = "PaymentsMigrated"
# Answer true when the server presents a certificate this machine does not
# already trust, which is usual for local and internal servers. false verifies
# the certificate properly.
trust_server_certificate = true
# "windows" connects as the signed-in account and needs no username at all.
authentication = "windows"
# username = "svc_recon"             # required when authentication = "password"
