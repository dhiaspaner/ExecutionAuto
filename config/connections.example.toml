# Example connection registry — SHAPE ONLY, no secrets, never used in milestone 1.
#
# Copy to config/connections.toml (git-ignored) when database adapters are
# enabled. The "Source Connection" / "Target Connection" columns in a workbook
# hold the logical NAME of an entry here, never a connection string.
#
# ---------------------------------------------------------------------------
# THIS FILE MUST NEVER CONTAIN A PASSWORD.
# ---------------------------------------------------------------------------
# There is no `password` key, and none will be added. Passwords are prompted for
# at runtime with getpass, held in process memory only, and never written to
# Excel, TOML, environment variables, logs or exception messages.

schema_version = "1.0"

[connections.LEGACY_ORACLE]
type = "oracle"
# Oracle EasyConnect descriptor. Host and service only — no credentials.
host = "legacy-db.internal.example"
port = 1521
service_name = "LEGACYPDB"
# "interactive": prompt for username, then getpass for the password, once per
# connection per run. Oracle normally uses interactive in version 1.
authentication = "interactive"
# Optional: pre-fill the username prompt. Still never a password.
default_username = "RECON_READONLY"

[connections.STAGING_SQLSERVER]
type = "sqlserver"
server = "staging-sql.internal.example"
database = "PaymentsStaging"
driver = "ODBC Driver 18 for SQL Server"
authentication = "interactive"
encrypt = true
trust_server_certificate = false

[connections.MIGRATED_SQLSERVER]
type = "sqlserver"
server = "migrated-sql.internal.example"
database = "Payments"
driver = "ODBC Driver 18 for SQL Server"
# "integrated" = Windows Integrated Authentication (Trusted_Connection). The
# run uses the signed-in Windows account; nothing is prompted and nothing is
# stored. Requires DBA approval. If integrated authentication fails, the run
# stops — it must never fall back to prompting.
authentication = "integrated"
encrypt = true
trust_server_certificate = false

# Every account referenced here must be READ-ONLY in the database itself. The
# framework's SQL guard is a second line of defence, not the first.
