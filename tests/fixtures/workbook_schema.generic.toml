# Workbook schema DSL — maps stable semantic fields to one Excel template's headers.
#
# This file is DATA ONLY. It is parsed with tomllib; no Python, shell command,
# Excel formula or SQL expression in it is ever evaluated.
#
# To support a different workbook template, copy this file, change the header
# strings and sheet geometry, and pass it with --schema. No Python change needed.
#
# Never put credentials or connection strings in a schema file.

schema_version = "1.0"
profile_name = "default-reconciliation"

[workbook]
test_case_sheet = "Execution Test Cases"
header_row = 1
first_data_row = 2
preserve_other_sheets = true
output_filename_pattern = "{input_stem}_results_{timestamp}.xlsx"

# --------------------------------------------------------------------------
# Input fields (read = true). The framework never writes to these.
# --------------------------------------------------------------------------

[fields.test_case_id]
header = "Test Case ID"
type = "string"
required = true
read = true
write = false

[fields.domain]
header = "Domain"
type = "string"
required = false
read = true
write = false

[fields.entity]
header = "Entity"
type = "string"
required = false
read = true
write = false

[fields.reconciliation_type]
header = "Reconciliation Type"
type = "string"
required = false
read = true
write = false

[fields.enabled]
header = "Enabled"
type = "boolean"
required = false
default = true
read = true
write = false

[fields.source_type]
header = "Source DB Type"
type = "enum"
allowed_values = ["oracle", "sqlserver"]
required = true
read = true
write = false

[fields.source_connection]
header = "Source Connection"
type = "string"
required = true
read = true
write = false

[fields.target_connection]
header = "Target Connection"
type = "string"
required = true
read = true
write = false

[fields.source_sql]
header = "Source Query"
type = "sql"
required = true
read = true
write = false

[fields.target_sql]
header = "Target Query"
type = "sql"
required = true
read = true
write = false

[fields.comparison_rule]
header = "Comparison Rule"
type = "enum"
allowed_values = ["equal", "expected_zero", "numeric_tolerance"]
required = false
default = "equal"
read = true
write = false

[fields.tolerance]
header = "Tolerance"
type = "decimal"
required = false
default = 0
read = true
write = false

[fields.timeout_seconds]
header = "Timeout Seconds"
type = "integer"
required = false
default = 120
read = true
write = false

[fields.expected_result]
header = "Expected Result"
type = "string"
required = false
read = true
write = false

[fields.severity]
header = "Severity"
type = "string"
required = false
read = true
write = false

# --------------------------------------------------------------------------
# Result fields (write = true). Only these cells are ever written.
# --------------------------------------------------------------------------

[fields.source_result]
header = "Source Results"
type = "scalar"
required = true
read = false
write = true

[fields.target_result]
header = "Target Results"
type = "scalar"
required = true
read = false
write = true

[fields.variance]
header = "Variance"
type = "decimal"
required = true
read = false
write = true

[fields.status]
header = "Status"
type = "enum"
allowed_values = ["PASS", "FAIL", "ERROR", "SKIPPED"]
required = true
read = false
write = true

[fields.remarks]
header = "Remarks"
type = "string"
required = true
read = false
write = true

[fields.executed_at]
header = "Executed At"
type = "datetime"
format = "yyyy-mm-dd hh:mm:ss"
timezone = "UTC"
required = true
read = false
write = true

[fields.run_id]
header = "Run ID"
type = "string"
required = true
read = false
write = true

[fields.duration_ms]
header = "Duration (ms)"
type = "integer"
required = true
read = false
write = true

[fields.error_side]
header = "Error Side"
type = "enum"
allowed_values = ["SOURCE", "TARGET", "COMPARISON", "WORKBOOK", ""]
required = true
read = false
write = true

[fields.error_code]
header = "Error Code"
type = "string"
required = false
read = false
write = true
