[project]
name = "migration-reconciliation"
version = "0.2.0"
description = "Workbook-driven data-migration reconciliation framework."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
]

[project.scripts]
reconcile = "migration_reconciliation.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/migration_reconciliation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
# The domain vocabulary has classes called TestStatus, TestDefinition and
# TestOutcome. Collecting by class-name prefix would try to instantiate them,
# so this suite uses test functions only and class collection stays off.
python_classes = []

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
